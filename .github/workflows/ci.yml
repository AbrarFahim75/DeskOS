name: CI

# Runs on every push and pull request so a broken change is caught before
# it reaches main - not after you have built the next milestone on top of it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install DeskOS with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The runner is headless, so the Tk widget tests skip themselves
        # automatically (see tests/test_chat_bubble.py). Everything that
        # does not need a display still runs.
        run: pytest -v
